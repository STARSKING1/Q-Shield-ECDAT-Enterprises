version: '3.8'

services:
  q-shield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: q_shield_ecdat_enterprise
    ports:
      - "8000:8000"
    environment:
      - QSHIELD_API_KEY=qshield_secret_key_2026
      - PYTHONPATH=/app
    volumes:
      - ./risk_report.json:/app/risk_report.json
      - ./cbom.json:/app/cbom.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
