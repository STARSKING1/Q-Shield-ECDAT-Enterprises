[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-shield-ecdat"
version = "1.0.0"
description = "Modular Post-Quantum Cryptography Discovery, Risk Assessment, and Automated Remediation Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Q-Shield Security Engineering Team", email = "security@qshield.enterprise" }
]
keywords = ["post-quantum-cryptography", "pqc", "fips-203", "fips-204", "ebpf", "cbom", "cyclonedx"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "libcst>=1.3.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py311']
