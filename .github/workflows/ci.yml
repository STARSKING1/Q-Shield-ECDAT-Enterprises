name: Q-Shield ECDAT Enterprise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn libcst pytest httpx

    - name: Create Package Markers
      run: |
        touch q_shield/__init__.py q_shield/api/__init__.py q_shield/engine/__init__.py q_shield/parsers/__init__.py

    - name: Execute Orchestration Pipeline
      run: |
        PYTHONPATH=. python main.py
        python generate_dashboard.py

    - name: Run Pytest Pipeline Suite
      run: |
        PYTHONPATH=. pytest tests/test_pipeline.py -v --tb=short
